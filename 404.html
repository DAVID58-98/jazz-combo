<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena (404) | jazzcombo.cz</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0c201f">
<link id="gfonts" rel="preload" as="style" href="/fonts/fonts.css">
<noscript><link rel="stylesheet" href="/fonts/fonts.css"></noscript>
<script>(function(){
  var d=document.documentElement,l=document.getElementById('gfonts'),done=false;
  function ok(){if(done)return;done=true;d.classList.remove('fonts-loading');d.classList.add('fonts-loaded');}
  function afterCss(){
    if(!document.fonts||!document.fonts.load){ok();return;}
    Promise.all([document.fonts.load('800 1em Unbounded'),document.fonts.load('700 1em Sora'),document.fonts.load('400 1em Poppins')]).then(ok)['catch'](ok);
  }
  if(l){l.addEventListener('load',function(){this.rel='stylesheet';afterCss();});l.addEventListener('error',ok);}
  else{afterCss();}
  setTimeout(ok,1500);
})();</script>
<style>
:root{--bg:#0c201f;--tile:#14302f;--gold:#e0a93c;--gold-2:#eec46f;--cream:#f4f0e4;--muted:#aebfb8;--line:rgba(224,169,60,.22);
--font-hero:'Unbounded',sans-serif;--font-head:'Sora',sans-serif;--font-body:'Poppins',sans-serif;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:var(--font-body);background:radial-gradient(60% 50% at 50% 30%,rgba(21,122,127,.3),transparent 70%),var(--bg);color:var(--cream);line-height:1.7;
min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center}
.brand{font-family:var(--font-hero);font-weight:800;font-size:20px;color:var(--cream);margin-bottom:40px;text-decoration:none}
.brand b{color:var(--gold)}
.code{font-family:var(--font-hero);font-weight:800;font-size:clamp(72px,16vw,140px);color:var(--gold);line-height:1;letter-spacing:-.03em}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em;margin:16px 0 12px}
p{color:var(--muted);font-size:16px;max-width:560px;margin:0 auto 30px}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{font-weight:600;font-size:15px;text-decoration:none;padding:14px 26px;border-radius:100px;transition:.2s;display:inline-block}
.primary{background:var(--gold);color:#0c201f}.primary:hover{background:var(--gold-2)}
.ghost{border:1.5px solid rgba(244,240,228,.3);color:var(--cream)}.ghost:hover{border-color:var(--gold);color:var(--gold)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sister{margin-top:34px;font-size:14px;color:var(--muted)}
.sister a{color:var(--gold);font-weight:600}
</style>
<style id="mo-vt">@view-transition{navigation:auto}::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}.topbar .brand,.site-header .brand{view-transition-name:mo-brand}.hero-slogans,.article-title{view-transition-name:mo-title}@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}</style>
</head>
<body>
<a class="brand" href="/">jazz<b>combo</b>.cz</a>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Tuhle stránku jsme nenašli</h1>
  <p>Možná se přesunula nebo je v adrese překlep. Zkuste to z úvodní stránky, nebo nám rovnou napište, s čím potřebujete pomoct.</p>
  <div class="links">
    <a class="btn primary" href="/">Zpět na úvod</a>
    <a class="btn ghost" href="/#poptavka">Nezávazná poptávka</a>
  </div>
  <p class="sister">Hledáte jinou sestavu? <a href="https://jazzduo.cz/">duo</a>, <a href="https://jazztrio.cz/">trio</a> nebo <a href="https://jazzquartet.cz/">kvartet</a></p>
</main>
</body>
</html>
